# Rafraîchissement quotidien des données (SCRAPING.md §7).
# 06:00 à Dakar (= 06:00 UTC). Re-télécharge S1 + S3 ; si rien n'a changé, s'arrête.
# Sinon parse → build → validate → tests, puis commit de data/ → Vercel redéploie.
# Si validate.py ou les tests échouent, le job échoue et RIEN n'est publié.
# La billetterie n'est jamais appelée depuis la CI (data/raw/tickets.json est manuel).
name: refresh-data

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Reconstruire même si les sources n'ont pas changé (ex. après mise à jour de tickets.json)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Installer les dépendances Python
        run: pip install -r scripts/requirements.txt

      - name: Télécharger, comparer, reconstruire, valider
        id: refresh
        env:
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: bash scripts/refresh.sh

      - name: Publier les données
        if: steps.refresh.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sessions.json data/venues.json data/sports.json data/meta.json \
                  data/validation-report.md data/raw/manifest.json
          if git diff --cached --quiet; then
            echo "Aucune différence dans data/ : rien à commiter."
            exit 0
          fi
          git commit -m "data: rafraîchissement du $(date -u +%Y-%m-%d)"
          git push
