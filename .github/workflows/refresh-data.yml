# Rafraîchissement quotidien des données (SCRAPING.md §7).
# 06:00 à Dakar (= 06:00 UTC). Re-télécharge S1 + S3 et les statuts billetterie (S2 : une
# requête à l'endpoint JSON public, échec silencieux) ; si rien n'a changé, s'arrête.
# Sinon parse → build → validate → tests, puis commit de data/ → Vercel redéploie.
# Si validate.py ou les tests échouent, le job échoue et RIEN n'est publié.
# Dans tous les cas où rien n'est poussé, on appelle le Deploy Hook Vercel : l'accueil, les
# métadonnées et l'image de partage sont figés au build sur la date du jour (Africa/Dakar),
# il faut donc un build chaque matin même quand les données n'ont pas bougé.
# Secret requis : VERCEL_DEPLOY_HOOK (Vercel → Settings → Git → Deploy Hooks).
# Billetterie : 1 requête/jour, User-Agent honnête, sans cookie ni retry (SCRAPING.md §4).
name: refresh-data

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Reconstruire même si les sources n'ont pas changé (ex. après mise à jour de tickets.json)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Installer les dépendances Python
        run: pip install -r scripts/requirements.txt

      - name: Télécharger, comparer, reconstruire, valider
        id: refresh
        env:
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: bash scripts/refresh.sh

      - name: Publier les données
        id: publish
        if: steps.refresh.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sessions.json data/venues.json data/sports.json data/meta.json \
                  data/validation-report.md data/raw/manifest.json data/raw/tickets.json
          if git diff --cached --quiet; then
            echo "Aucune différence dans data/ : rien à commiter."
            exit 0
          fi
          git commit -m "data: rafraîchissement du $(date -u +%Y-%m-%d)"
          git push
          # le push déclenche déjà un déploiement Vercel
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Rebuild quotidien du site (Deploy Hook Vercel)
        # même si les sources n'ont pas changé ou si la validation a échoué (le site est alors
        # reconstruit avec les dernières données valides) ; pas besoin si un commit vient d'être poussé
        if: ${{ !cancelled() && steps.publish.outputs.pushed != 'true' }}
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::Secret VERCEL_DEPLOY_HOOK absent : le site ne sera pas reconstruit aujourd'hui."
            exit 1
          fi
          curl -fsS -X POST --retry 2 --retry-delay 10 "$HOOK" > /dev/null
          echo "Rebuild Vercel demandé."
